    <!-- SCRIPT PER L'EFFETTO COMPARSA ALLO SCROLL -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Seleziona tutti gli elementi con la classe scroll-reveal
            const revealElements = document.querySelectorAll('.scroll-reveal');

            // Crea l'osservatore
            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    // Se l'elemento entra nella visuale dello schermo
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visibile');
                        // Smette di osservare l'elemento (l'animazione avviene una sola volta)
                        observer.unobserve(entry.target);
                    }
                });
            }, {
                // Fa partire l'animazione quando il 15% dell'elemento è visibile
                threshold: 0.15 
            });

            // Applica l'osservatore agli elementi trovati
            revealElements.forEach(el => {
                observer.observe(el);
            });
        });
    </script>
